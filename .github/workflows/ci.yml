name: CI

# The real gate. Runs on every pull request and on pushes to the main and
# feature branches — not filtered to www/pro/**, so an ordinary Appearance,
# i18n or service-worker change is actually tested. The release workflow depends
# on this passing (see build-release.yml), so a red suite blocks publication.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'

jobs:
  test:
    # Keep the runner compatible with the Chromium builds in locked Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pages workflow — stable runtime and matching PWA validation
        run: node tests/test_pages_workflow.mjs

      - name: Localized Free release notes for Pages
        run: node tests/test_public_release_notes.mjs

      - name: Install dependencies
        run: npm install

      - name: Candidate identity, unsigned Android assets and publication boundaries
        run: node tests/test_android_candidate.mjs && node tests/test_candidate_workflow.mjs

      - name: Component licences and release metadata
        run: npm run licenses:check && npm run release:check

      - name: Configure build
        run: npm run configure

      - name: Fetch bundled runtimes
        run: npm run fetch:bundles

      - name: Verify completed bundle inventories and wheel notices
        run: npm run verify:bundles

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Static i18n gates — cheap, and each catches a class of bug no runtime
      # test does. Run before the server so a catalogue error fails fast.
      - name: i18n — manifest is current
        run: node scripts/build-i18n-manifest.mjs --check

      - name: i18n — no id-bearing markup inside a translated string
        run: node scripts/check-i18n-html-ids.mjs

      - name: i18n — every referenced key exists
        run: node scripts/check-i18n-keys.mjs

      - name: i18n — catalogue lint
        run: node scripts/check-translations.mjs

      - name: Catalogue search, source, integrity, and cache rules
        run: npm run test:catalog

      - name: Privacy policy — public and in-app disclosures agree
        run: npm run privacy:check

      - name: Service worker — shell version guard
        run: node scripts/check-sw-shell.mjs

      - name: Service worker — shell-guard cannot be bypassed
        run: node tests/test_sw_shell_guard.mjs

      - name: Python packaging >=26 for the specifier differential
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Beginner CSV workbook creates and reads its dataset
        run: npm run test:csv-workbook
      - name: Install packaging for the differential oracle
        run: python3 -m pip install 'packaging>=26'
      - name: Pip resolver unit tests (deterministic, fixture lockfile)
        run: node tests/test_pip_resolver.mjs

      - name: Start dev server
        run: node server.js &

      - name: Wait for server
        run: sleep 2 && curl -sf http://localhost:8085/ > /dev/null

      - name: Public help links, metadata and narrow layouts
        run: npm run test:help

      # Browser suites. These need the bundled runtimes fetched above.
      - name: Appearance and localization
        run: node tests/test_appearance.mjs

      - name: Onboarding tour
        run: node tests/test_onboarding.mjs

      - name: App tutorial entry links
        run: node tests/test_tutorial_links.mjs

      - name: Android status-bar hiding and the status-bar allowance
        run: npm run test:status-bar

      - name: Android hardware Back routing
        run: npm run test:android-back

      - name: Android debug identity and launcher resources
        run: npm run test:android-debug-identity

      - name: Workbook close and Android cloud-file import
        run: npm run test:workbook-close-import

      - name: What's New and header shortcuts
        run: node tests/test_whats_new.mjs

      - name: Language selectors expose full native option names
        run: node tests/test_lang_selector.mjs

      - name: Header shortcuts — three states, priority and fit
        run: node tests/test_header_shortcuts.mjs

      - name: Math palette, contexts, layout invariants
        run: node tests/test_math_palette.mjs

      - name: Pip cell semantics (failed installs stop the cell; dep healing)
        run: node tests/test_pip_cell.mjs

      - name: Matplotlib first plot with bundled Python and real package installs
        run: npm run test:matplotlib-first-show -- --focused

      - name: Right-to-left layout
        run: node tests/test_rtl_layout.mjs

      - name: Composer Run button fits long-label locales
        run: npm run test:composer-fit

      - name: Short-landscape composer collapse
        run: npm run test:landscape-composer

      - name: Header controls follow scaled text
        run: npm run test:header-scaling

      - name: Generated and dynamic localization
        run: node tests/test_i18n_dynamic.mjs

      - name: Runtime provenance and version controls
        run: npm run test:runtime-metadata

      - name: Service worker offline and upgrade coherence
        run: node tests/test_sw_offline.mjs

      - name: Auto-save and crash recovery
        run: node tests/test_autosave.mjs

      - name: Cell operations
        run: node tests/test_cell_ops.mjs

      - name: Help examples — Copy and Insert
        run: node tests/test_help_examples.mjs

      - name: JavaScript kernel
        run: node tests/test_js_kernel.mjs

      - name: Matplotlib cold first-show placement
        run: npm run test:matplotlib-first-show

      - name: Notebook VFS
        run: node tests/test_notebook_vfs.mjs

      - name: Package, bundle and workbook catalogue
        run: node tests/test_browse_catalog.mjs

      - name: N-Queens Prolog-to-ClojureScript workbook
        run: node tests/test_nqueens_workbook.mjs

      - name: Verified catalogue workbook import
        run: npm run test:catalog:import

  # test_pwa_release starts its OWN server (on :8086) and drives a full install/
  # offline/reload cycle, so it runs in a dedicated job rather than sharing the
  # long-running suite above.
  pwa-release:
    # Keep the runner compatible with the Chromium builds in locked Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run licenses:check && npm run release:check
      - run: npm run configure
      - run: npm run fetch:bundles
      - run: npm run verify:bundles
      - run: npx playwright install chromium
      - name: PWA offline/release regression
        run: node tests/test_pwa_release.mjs

  # Explicit release-label checks only: ordinary PRs do not pay for platform
  # packaging, and tagging/publishing is never part of these candidate jobs.
  # Add the release label BEFORE pushing the candidate commit. Label events do
  # not run this workflow or replace core test results with skipped contexts.
  windows-candidate:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release')
    needs: [test, pwa-release]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run licenses:check && npm run release:check
      - name: Read safe candidate artifact label
        id: artifact
        shell: bash
        run: echo "label=$(node scripts/release-artifact-label.mjs)" >> "$GITHUB_OUTPUT"
      - run: npm run configure
      - run: npm run fetch:bundles
      - run: npm run verify:bundles
      - run: npm run windows:install
      - run: npm run package:windows
      - name: Verify the actual packaged Windows application
        run: node desktop/electron/test/run-all.mjs packaged
      - name: Zip the tested candidate
        shell: pwsh
        env:
          SCIREPL_ARTIFACT_LABEL: ${{ steps.artifact.outputs.label }}
        run: |
          $tree = 'desktop/electron/out/SciREPL-win32-x64'
          if (-not (Test-Path $tree)) { throw "packaging produced nothing at $tree" }
          $zip = "SciREPL-${env:SCIREPL_ARTIFACT_LABEL}-windows-x64-portable.zip"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=5 "$zip" "$tree/*"
            if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
          } else {
            Compress-Archive -Path "$tree/*" -DestinationPath "$zip" -CompressionLevel Optimal
          }
      - name: Upload tested Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: free-windows-candidate
          path: SciREPL-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-windows-candidate-test-results
          path: desktop/electron/test/results/
          if-no-files-found: warn

  android-candidate:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release')
    needs: [test, pwa-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run licenses:check && npm run release:check
      - name: Read safe candidate artifact label
        id: artifact
        run: echo "label=$(node scripts/release-artifact-label.mjs)" >> "$GITHUB_OUTPUT"
      - run: npm run configure
      - run: npm run fetch:bundles
      - run: npm run verify:bundles
      - run: npx cap sync android
      - name: Build unsigned Free APK and Play bundle
        env:
          SCIREPL_RELEASE_STORE_FILE: ''
          SCIREPL_RELEASE_STORE_PASSWORD: ''
          SCIREPL_RELEASE_KEY_ALIAS: ''
          SCIREPL_RELEASE_KEY_PASSWORD: ''
        run: |
          test ! -e android/release-signing.properties
          cd android
          ./gradlew assembleRelease bundleRelease
      - name: Fetch pinned bundle validator
        run: node scripts/validate-android-candidate.mjs --fetch-bundletool "$RUNNER_TEMP/bundletool.jar"
      - name: Validate unsigned Free Android candidate
        run: |
          mkdir -p dist
          node scripts/validate-android-candidate.mjs \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --apk android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --bundletool "$RUNNER_TEMP/bundletool.jar" > dist/ANDROID_VALIDATION.json
      - name: Name and hash validated Android candidate
        env:
          SCIREPL_ARTIFACT_LABEL: ${{ steps.artifact.outputs.label }}
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
             "dist/SciREPL-${SCIREPL_ARTIFACT_LABEL}-unsigned.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/SciREPL-${SCIREPL_ARTIFACT_LABEL}-play-unsigned.aab"
          sha256sum dist/*.aab dist/*.apk dist/ANDROID_VALIDATION.json > dist/SHA256SUMS.txt
      - name: Upload validated unsigned Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: free-android-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
