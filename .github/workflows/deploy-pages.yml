name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0-beta, etc.
    # Publish when the Pro policy changes on main without moving an existing release tag.
    # GitHub does not evaluate path filters for tag pushes, so all v* tags still deploy.
    paths:
      - 'www/pro/privacy.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Configure release build
        run: npm run configure

      - name: Fetch bundled runtimes
        run: npm run fetch:bundles

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start dev server
        run: node server.js &

      - name: Wait for server
        run: sleep 2 && curl -sf http://localhost:8085/ > /dev/null

      - name: Run cell operations tests
        run: node test_cell_ops.mjs

      - name: Run JavaScript kernel tests
        run: node test_js_kernel.mjs

      - name: Run WASM FFI tests
        run: node test_wasm_ffi.mjs

      - name: Run kernel source-selection tests
        run: npm run test:sources

      - name: Run package catalog tests
        run: node test_browse_catalog.mjs

      - name: Run TypR workbook tests
        run: node test_typr_workbooks.mjs

      - name: Run PWA offline catalog tests
        timeout-minutes: 15
        run: node test_pwa_release.mjs

      # Upload the exact prepared www/ tree that passed the tests above.
      # A fresh checkout here would omit the generated, gitignored runtimes.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
