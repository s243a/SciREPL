name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0-beta, etc.
    # Publish when the Pro landing page or policy changes on main without moving
    # an existing release tag.
    # GitHub does not evaluate path filters for tag pushes, so all v* tags still deploy.
    paths:
      - 'www/pro/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A Pro-only Pages update is overlaid onto the latest stable Free
          # release below, so the release tags must be available locally.
          fetch-depth: 0

      - name: Keep Pro-only updates on the latest stable Free release
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          pro_overlay="${RUNNER_TEMP}/scirepl-pro-pages"
          mkdir -p "${pro_overlay}"
          cp -a www/pro/. "${pro_overlay}/"

          stable_tag=""
          while IFS= read -r candidate; do
            if [[ "${candidate}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              stable_tag="${candidate}"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)

          if [[ -z "${stable_tag}" ]]; then
            echo "No stable vMAJOR.MINOR.PATCH tag is available." >&2
            exit 1
          fi

          git checkout --detach "${stable_tag}"
          rm -rf -- www/pro
          mkdir -p www/pro
          cp -a "${pro_overlay}/." www/pro/
          echo "Publishing Pro pages over stable Free release ${stable_tag} ($(git rev-parse HEAD))."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check component licences and release metadata
        run: npm run licenses:check && npm run release:check

      - name: Configure release build
        run: npm run configure

      - name: Fetch bundled runtimes
        run: npm run fetch:bundles

      - name: Verify completed bundle inventories and wheel notices
        run: npm run verify:bundles

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start dev server
        run: node server.js &

      - name: Wait for server
        run: sleep 2 && curl -sf http://localhost:8085/ > /dev/null

      # i18n gates. These are cheap and catch classes of bug that no runtime
      # test will: a catalogue that drifts from the manifest, a locale that is
      # not precached and so vanishes offline, UI added without a translation
      # key, and a sense id that does not resolve.
      - name: Check the locale manifest is current
        run: node scripts/build-i18n-manifest.mjs --check

      - name: Lint the translation catalogues
        run: node scripts/check-translations.mjs

      - name: Check no element with an id is inside a translated HTML string
        run: node scripts/check-i18n-html-ids.mjs

      - name: Check every key the code asks for exists
        run: node scripts/check-i18n-keys.mjs

      - name: Check public and in-app privacy disclosures agree
        run: npm run privacy:check

      # Tag-only coverage: the Pages main path checks out the last stable
      # Free tag, which may predate these suites — guard on file existence
      # so old tags deploy while new tags are fully gated.
      # Explicit if/then so a PRESENT-but-FAILING suite fails the deploy;
      # only a suite absent from an old tag may be skipped.
      - name: Python packaging >=26 for the specifier differential
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging for the differential oracle
        run: python3 -m pip install 'packaging>=26'
      - name: Pip resolver unit tests (when present on this tag)
        run: |
          if test -f test_pip_resolver.mjs; then
            node test_pip_resolver.mjs
          else
            echo "suite not on this tag — skipped"
          fi

      - name: Pip cell regressions (when present on this tag)
        run: |
          if test -f test_pip_cell.mjs; then
            node test_pip_cell.mjs
          else
            echo "suite not on this tag — skipped"
          fi

      - name: Math palette regressions (when present on this tag)
        run: |
          if test -f test_math_palette.mjs; then
            node test_math_palette.mjs
          else
            echo "suite not on this tag — skipped"
          fi

      - name: Run cell operations tests
        run: node test_cell_ops.mjs

      - name: Run JavaScript kernel tests
        run: node test_js_kernel.mjs

      - name: Run notebook VFS tests
        run: node test_notebook_vfs.mjs

      - name: Run WASM FFI tests
        run: node test_wasm_ffi.mjs

      - name: Run appearance and localization tests
        run: node test_appearance.mjs

      - name: Run onboarding tour tests
        run: node test_onboarding.mjs

      - name: Run Android hardware Back tests (when present on this tag)
        run: |
          if test -f test_android_back.mjs; then
            npm run test:android-back
          else
            echo "test_android_back.mjs absent on this ref; skipping"
          fi

      - name: Run What's New and header-shortcut tests
        # Older tags predate test_header_shortcuts.mjs; the explicit if/else
        # keeps them deployable while a FAILING suite still fails the step —
        # `test -f && node || echo` would swallow the node exit code.
        run: |
          node test_whats_new.mjs
          if test -f test_header_shortcuts.mjs; then
            npm run test:header-shortcuts
          else
            echo "test_header_shortcuts.mjs absent on this ref; skipping"
          fi

      - name: Run language-selector tests (when present on this tag)
        run: |
          if test -f test_lang_selector.mjs; then
            npm run test:lang-selector
          else
            echo "test_lang_selector.mjs absent on this ref; skipping"
          fi

      - name: Run right-to-left layout tests
        run: node test_rtl_layout.mjs

      - name: Run generated and dynamic localization tests
        run: node test_i18n_dynamic.mjs

      - name: Run runtime provenance and version-control tests
        run: npm run test:runtime-metadata

      - name: Run service worker offline tests
        run: node test_sw_offline.mjs

      - name: Run auto-save and restore tests
        run: node test_autosave.mjs

      - name: Run kernel source-selection tests
        run: npm run test:sources

      - name: Run package catalog tests
        run: node test_browse_catalog.mjs

      - name: Run N-Queens workbook tests
        if: startsWith(github.ref, 'refs/tags/')
        run: node test_nqueens_workbook.mjs

      - name: Run TypR workbook tests
        run: node test_typr_workbooks.mjs

      - name: Run PWA offline catalog tests
        timeout-minutes: 15
        run: node test_pwa_release.mjs

      # Upload the exact prepared www/ tree that passed the tests above.
      # A fresh checkout here would omit the generated, gitignored runtimes.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
