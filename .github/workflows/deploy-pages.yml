name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0-beta, etc.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start dev server
        run: node server.js &

      - name: Wait for server
        run: sleep 2 && curl -sf http://localhost:8085/ > /dev/null

      - name: Run cell operations tests
        run: node test_cell_ops.mjs

      - name: Run JavaScript kernel tests
        run: node test_js_kernel.mjs

      - name: Run WASM FFI tests
        run: node test_wasm_ffi.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
