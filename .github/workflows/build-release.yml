# A manual run builds tested unsigned candidate artifacts only. A pushed v* tag
# also creates a GitHub pre-release after every gate passes. A manual run, even
# when selecting an existing tag, never creates a release or publishes Pages.
name: Build Release or Candidate (AAB + APK + PWA + Windows)

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0-beta, etc.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Release must not publish an artifact the suites have not passed. This runs
  # the same gate as ci.yml; build depends on it, so a red suite blocks the
  # APK/PWA from being built or released.
  test:
    # Keep the runner compatible with the Chromium builds in locked Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node tests/test_android_candidate.mjs && node tests/test_candidate_workflow.mjs
      - run: npm run licenses:check && npm run release:check
      - run: npm run configure
      - run: npm run fetch:bundles
      - run: npm run verify:bundles
      - run: npx playwright install chromium
      - run: node scripts/build-i18n-manifest.mjs --check
      - run: node scripts/check-i18n-html-ids.mjs
      - run: node scripts/check-i18n-keys.mjs
      - run: node scripts/check-translations.mjs
      - run: npm run test:catalog
      - run: npm run privacy:check
      - run: node scripts/check-sw-shell.mjs
      - run: node tests/test_sw_shell_guard.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:csv-workbook
      - run: python3 -m pip install 'packaging>=26'
      - run: npm run test:pip-resolver
      - run: node server.js &
      - run: sleep 2 && curl -sf http://localhost:8085/ > /dev/null
      - run: node tests/test_appearance.mjs
      - run: node tests/test_onboarding.mjs
      - run: npm run test:tutorial-links
      - run: npm run test:status-bar
      - run: npm run test:landscape-composer
      - run: node tests/test_help_examples.mjs
      - run: npm run test:android-back
      - run: npm run test:workbook-close-import
      - run: node tests/test_whats_new.mjs
      - run: npm run test:header-shortcuts
      - run: npm run test:lang-selector
      - run: npm run test:math-palette
      - run: npm run test:pip-cell
      - run: node tests/test_rtl_layout.mjs
      - run: node tests/test_i18n_dynamic.mjs
      - run: npm run test:runtime-metadata
      - run: node tests/test_sw_offline.mjs
      - run: node tests/test_autosave.mjs
      - run: node tests/test_cell_ops.mjs
      - run: node tests/test_js_kernel.mjs
      - run: node tests/test_notebook_vfs.mjs
      - run: npm run test:catalog:import

  # The unsigned portable Windows application. windows-portable-preview.yml
  # builds the same thing on demand, but uploads it as a workflow artifact that
  # GitHub deletes after fourteen days. A tagged build is meant to outlive that,
  # so here it is handed to the release job and attached to the release itself,
  # alongside the APK and the PWA zip.
  windows-portable:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Check committed component notices and release metadata
        run: npm run licenses:check && npm run release:check

      - name: Read safe artifact label
        id: artifact
        shell: bash
        run: echo "label=$(node scripts/release-artifact-label.mjs)" >> "$GITHUB_OUTPUT"

      # The Free profile. build-portable.mjs refuses to package the `pro`
      # profile or a tree containing the offline R runtime, so this is enforced
      # rather than assumed.
      - name: Configure the Free build profile
        run: npm run configure

      - name: Fetch the Free bundled runtimes
        run: npm run fetch:bundles

      - name: Verify completed bundle inventories and wheel notices
        run: npm run verify:bundles

      - name: Install Electron (isolated, pinned)
        run: npm run windows:install

      - name: Build the portable application
        run: npm run package:windows

      - name: Verify the packaged application
        run: node desktop/electron/test/run-all.mjs packaged

      - name: Zip the portable application
        shell: pwsh
        env:
          SCIREPL_ARTIFACT_LABEL: ${{ steps.artifact.outputs.label }}
        run: |
          $tree = 'desktop/electron/out/SciREPL-win32-x64'
          if (-not (Test-Path $tree)) { throw "packaging produced nothing at $tree" }
          $zip = "SciREPL-${env:SCIREPL_ARTIFACT_LABEL}-windows-x64-portable.zip"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=5 "$zip" "$tree/*"
            if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
          } else {
            Compress-Archive -Path "$tree/*" -DestinationPath "$zip" -CompressionLevel Optimal
          }
          "{0} is {1:N0} bytes" -f $zip, (Get-Item $zip).Length

      - name: Hand the zip to the release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: SciREPL-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 7
          # Already a compressed archive; recompressing buys nothing.
          compression-level: 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-test-results
          path: desktop/electron/test/results/
          if-no-files-found: warn

  build:
    needs:
      - test
      - windows-portable
    # Keep the runner compatible with the Chromium builds in locked Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install

      - name: Read safe artifact label
        id: artifact
        run: echo "label=$(node scripts/release-artifact-label.mjs)" >> "$GITHUB_OUTPUT"

      - name: Check committed component notices and release metadata
        run: npm run licenses:check && npm run release:check

      - name: Configure release build
        run: npm run configure

      - name: Fetch bundled runtimes
        run: npm run fetch:bundles

      - name: Verify completed bundle inventories and wheel notices
        run: npm run verify:bundles

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Start dev server
        run: node server.js &

      - name: Wait for dev server
        run: sleep 2 && curl -sf http://localhost:8085/ > /dev/null

      - name: Run kernel source-selection tests
        run: npm run test:sources

      - name: Run package catalog tests
        run: node tests/test_browse_catalog.mjs

      - name: Run N-Queens workbook tests
        run: node tests/test_nqueens_workbook.mjs

      - name: Run TypR workbook tests
        run: node tests/test_typr_workbooks.mjs

      - name: Run PWA offline catalog tests
        timeout-minutes: 15
        run: node tests/test_pwa_release.mjs
      
      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Build unsigned APK and Play bundle
        env:
          SCIREPL_RELEASE_STORE_FILE: ''
          SCIREPL_RELEASE_STORE_PASSWORD: ''
          SCIREPL_RELEASE_KEY_ALIAS: ''
          SCIREPL_RELEASE_KEY_PASSWORD: ''
        run: |
          test ! -e android/release-signing.properties
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Fetch the pinned bundle validator
        run: node scripts/validate-android-candidate.mjs --fetch-bundletool "$RUNNER_TEMP/bundletool.jar"

      - name: Validate unsigned Free Android artifacts
        run: |
          node scripts/validate-android-candidate.mjs \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --apk android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --bundletool "$RUNNER_TEMP/bundletool.jar"
      
      - name: Name the validated Android artifacts
        env:
          SCIREPL_ARTIFACT_LABEL: ${{ steps.artifact.outputs.label }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
             "dist/SciREPL-${SCIREPL_ARTIFACT_LABEL}-unsigned.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/SciREPL-${SCIREPL_ARTIFACT_LABEL}-play-unsigned.aab"

      - name: Package PWA as zip
        env:
          SCIREPL_ARTIFACT_LABEL: ${{ steps.artifact.outputs.label }}
        run: |
          cd www
          zip -r "../dist/SciREPL-${SCIREPL_ARTIFACT_LABEL}-pwa.zip" . \
            -x "*.DS_Store"
          cd ..

      - name: Collect the Windows portable zip
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-zip
          path: dist

      - name: Stage prepared GitHub release notes
        run: |
          release_version=$(node -p "require('./package.json').version")
          test -s "docs/releases/${release_version}-github-notes.txt"
          cp "docs/releases/${release_version}-github-notes.txt" dist/RELEASE_NOTES.md

      - name: Hash the candidate assets
        run: sha256sum dist/*.aab dist/*.apk dist/*.zip dist/RELEASE_NOTES.md > dist/SHA256SUMS.txt

      - name: Upload tested unsigned assets
        uses: actions/upload-artifact@v4
        with:
          name: free-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    # Checking only ref_type would publish a manual run selected on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@v4
        with:
          name: free-release-assets
          path: dist

      - name: Verify downloaded asset hashes
        run: sha256sum -c dist/SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/SciREPL-${{ github.ref_name }}-play-unsigned.aab
            dist/SciREPL-${{ github.ref_name }}-unsigned.apk
            dist/SciREPL-${{ github.ref_name }}-pwa.zip
            dist/SciREPL-${{ github.ref_name }}-windows-x64-portable.zip
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: true
          body_path: dist/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
