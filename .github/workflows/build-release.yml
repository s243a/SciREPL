name: Build Release (APK + PWA)

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0-beta, etc.

jobs:
  # Release must not publish an artifact the suites have not passed. This runs
  # the same gate as ci.yml; build depends on it, so a red suite blocks the
  # APK/PWA from being built or released.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run licenses:check && npm run release:check
      - run: npm run configure
      - run: npm run fetch:bundles
      - run: npm run verify:bundles
      - run: npx playwright install chromium
      - run: node scripts/build-i18n-manifest.mjs --check
      - run: node scripts/check-i18n-html-ids.mjs
      - run: node scripts/check-i18n-keys.mjs
      - run: node scripts/check-translations.mjs
      - run: node test_catalog_filter.mjs
      - run: npm run privacy:check
      - run: node scripts/check-sw-shell.mjs
      - run: node test_sw_shell_guard.mjs
      - run: node server.js &
      - run: sleep 2 && curl -sf http://localhost:8085/ > /dev/null
      - run: node test_appearance.mjs
      - run: node test_onboarding.mjs
      - run: node test_whats_new.mjs
      - run: node test_rtl_layout.mjs
      - run: node test_i18n_dynamic.mjs
      - run: npm run test:runtime-metadata
      - run: node test_sw_offline.mjs
      - run: node test_autosave.mjs
      - run: node test_cell_ops.mjs
      - run: node test_js_kernel.mjs
      - run: node test_notebook_vfs.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install

      - name: Check committed component notices and release metadata
        run: npm run licenses:check && npm run release:check

      - name: Configure release build
        run: npm run configure

      - name: Fetch bundled runtimes
        run: npm run fetch:bundles

      - name: Verify completed bundle inventories and wheel notices
        run: npm run verify:bundles

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Start dev server
        run: node server.js &

      - name: Wait for dev server
        run: sleep 2 && curl -sf http://localhost:8085/ > /dev/null

      - name: Run kernel source-selection tests
        run: npm run test:sources

      - name: Run package catalog tests
        run: node test_browse_catalog.mjs

      - name: Run TypR workbook tests
        run: node test_typr_workbooks.mjs

      - name: Run PWA offline catalog tests
        timeout-minutes: 15
        run: node test_pwa_release.mjs
      
      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Build unsigned APK
        run: |
          cd android
          ./gradlew assembleRelease
      
      - name: Rename APK for clarity
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
             android/app/build/outputs/apk/release/SciREPL-${{ github.ref_name }}-unsigned.apk || \
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/SciREPL-${{ github.ref_name }}-unsigned.apk

      - name: Package PWA as zip
        run: |
          cd www
          zip -r ../SciREPL-${{ github.ref_name }}-pwa.zip . \
            -x "*.DS_Store"
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/SciREPL-${{ github.ref_name }}-unsigned.apk
            SciREPL-${{ github.ref_name }}-pwa.zip
          prerelease: true
          body: |
            > **Pre-release** — unsigned APK for testing. After signing, upload `SciREPL-${{ github.ref_name }}.apk` and mark as latest release.

            ## Downloads

            - **Android APK (signed):** Upload pending — download `SciREPL-${{ github.ref_name }}.apk` once available
            - **Android APK (unsigned):** `SciREPL-${{ github.ref_name }}-unsigned.apk` — requires signing before install (see below)
            - **PWA (zip):** `SciREPL-${{ github.ref_name }}-pwa.zip` — unzip and serve over HTTPS or localhost (service workers do not run from `file://`)
            - **PWA (live):** [https://s243a.github.io/SciREPL/](https://s243a.github.io/SciREPL/) — install from browser, no app store needed

            ## Updating the PWA

            If you already have the PWA installed, make sure you're running the latest version:

            - **Desktop:** Press `Ctrl+Shift+R` to force-reload and clear the service worker cache
            - **Mobile / newer versions:** Open the **Menu** and tap **Reload App**

            ## Signing the Unsigned APK

            If you prefer to sign the APK yourself:

            1. Zipalign:
               ```bash
               zipalign -v 4 SciREPL-${{ github.ref_name }}-unsigned.apk \
                 SciREPL-${{ github.ref_name }}-aligned.apk
               ```
            2. Sign with apksigner (v2):
               ```bash
               apksigner sign --ks your-keystore.keystore \
                 --ks-key-alias your-alias \
                 --out SciREPL-${{ github.ref_name }}.apk \
                 SciREPL-${{ github.ref_name }}-aligned.apk
               ```
            3. Install: `adb install SciREPL-${{ github.ref_name }}.apk`

            **For maintainers:** After signing, upload the signed APK and edit this release to add a changelog and mark as latest.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
