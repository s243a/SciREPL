import java.util.Properties
import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// package.json is the release identity shared by the PWA, Capacitor/Android
// and Electron. Keeping Android's monotonically increasing Play version code
// beside it means a release bump has one source rather than two files that can
// silently disagree.
def packageMetadata = new JsonSlurper().parse(rootProject.file('../package.json'))
def appVersionName = packageMetadata.version?.toString()
def appVersionCode = packageMetadata.android?.versionCode
if (!appVersionName || !(appVersionCode instanceof Number) || appVersionCode.intValue() < 1) {
    throw new GradleException('package.json must define version and android.versionCode')
}

def releaseSigningPropertiesFile = rootProject.file("release-signing.properties")
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

def signingProperty = { key, envName ->
    def value = releaseSigningProperties.getProperty(key)
    if (value == null || value.trim().isEmpty()) {
        value = System.getenv(envName)
    }
    return value
}

def releaseStoreFilePath = signingProperty('storeFile', 'SCIREPL_RELEASE_STORE_FILE')
def releaseStorePassword = signingProperty('storePassword', 'SCIREPL_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingProperty('keyAlias', 'SCIREPL_RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingProperty('keyPassword', 'SCIREPL_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [releaseStoreFilePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    it != null && !it.trim().isEmpty()
}

def resolveReleaseStoreFile = {
    def storeFileCandidate = new File(releaseStoreFilePath)
    if (!storeFileCandidate.isAbsolute()) {
        storeFileCandidate = new File(releaseSigningPropertiesFile.parentFile, releaseStoreFilePath)
    }
    return storeFileCandidate
}

android {
    namespace "com.unifyweaver.scirepl"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile resolveReleaseStoreFile()
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    defaultConfig {
        applicationId "com.unifyweaver.scirepl"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode.intValue()
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    // Force older androidx.browser to stay compatible with the project's
    // pinned Android Gradle plugin while compiling against API 36.
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
